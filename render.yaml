services:
  - type: web
    name: stock-cycle-tracker
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python run_app.py --port 10000 --host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "10000"
      # Shows the "Launch Demo" button on the live site. Remove this line to
      # hide it — demo login is off unless this is exactly "1".
      - key: ENABLE_DEMO_LOGIN
        value: "1"
